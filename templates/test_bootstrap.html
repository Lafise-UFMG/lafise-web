<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Bootstrap</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center text-primary">Teste Bootstrap</h1>
                <div class="alert alert-success" role="alert">
                    Se você consegue ver este alerta verde e o título azul centralizado, o Bootstrap está funcionando!
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        Card de Teste
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">Título do Card</h5>
                        <p class="card-text">Este é um teste para verificar se o Bootstrap está carregando corretamente.</p>
                        <a href="#" class="btn btn-primary">Botão Bootstrap</a>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <button type="button" class="btn btn-success mb-2">Sucesso</button><br>
                <button type="button" class="btn btn-warning mb-2">Aviso</button><br>
                <button type="button" class="btn btn-danger mb-2">Perigo</button><br>
                <button type="button" class="btn btn-info mb-2">Info</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
